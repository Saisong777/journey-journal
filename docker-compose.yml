services:
  postgres:
    image: postgres:17-alpine
    container_name: journey-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: journey_journal
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey_local_password
    ports:
      - "54329:5432"
    volumes:
      - journey_journal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey_journal"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  journey_journal_postgres:
